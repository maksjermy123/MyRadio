name: keep-alive

# Держим Render free tier от засыпания. Без входящего трафика сервис
# засыпает через ~15 минут, а планировщик напоминаний Библии живёт ВНУТРИ
# процесса — спящий процесс = пропущенные напоминания (реальный кейс:
# хронологический план на 8:00 приходил, аудиоплан на 9:00-10:00 — нет).
# Два смещённых cron'а дают пинг каждые ~2.5-5 минут — сервис не успевает
# заснуть. ВАЖНО: GitHub отключает scheduled workflows после 60 дней без
# коммитов в репозитории — если пинг прекратится, достаточно любого коммита
# или ручного запуска (Run workflow).

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://myradio-rrsk.onrender.com/)
          echo "HTTP $code at $(date -u +%FT%TZ)"
          test "$code" = "200"
